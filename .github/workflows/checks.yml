name: checks

# The first CI in this repo. Its whole value is that RED MEANS BROKEN, so it deliberately runs a
# small, deterministic set rather than everything imaginable: the installer-consistency check and
# the rew_tool modules' own selftests. No network beyond installing dependencies, no REW, no
# fixtures downloaded at run time. A check that blinks gets ignored within a week, and an ignored
# CI is worse than none -- it launders "nobody looked" into a green tick.
#
# Dependencies are NOT pinned. A break caused by a new numpy or scipy is real information: these
# tools ship to people who will install current versions, so we would rather learn it here.

# Once per wave (hub governance/WAVES.md, HUB-065). The full run is the PULL REQUEST's. A push to main
# first asks whether a green pull-request run of this workflow exists on the same commit: yes -- the
# heavy jobs are skipped and the run still ends `success`, which is what the hub's release gate
# reads; no -- a merge without a PR, or GitHub's button making a new commit -- they run here. A work
# branch runs nothing on push; `workflow_dispatch` runs it by hand, for a change that touches Windows
# or the installers. 149 runs from 8 to 14.09 are what this replaces.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes anything: the job reads the tree, runs selftests and a linter, and reports.
# Without this block GITHUB_TOKEN gets whatever the ACCOUNT defaults to, which can be write -- a
# permission nobody declared and nothing uses. Declaring the floor is cheaper than auditing the
# default later (HUB-038).
permissions:
  contents: read
  # `gate` reads this workflow's own runs. Read, nothing more.
  actions: read

# A newer push supersedes an in-flight run on the same ref; stale runs are noise, not signal.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the jobs below run. Anything it cannot establish -- no answer from the API, an
  # unexpected shape -- counts as "not found", so the tests run: a skip needs a green run to point at.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.pr.outputs.run }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          found="$(gh api "repos/${{ github.repository }}/actions/workflows/checks.yml/runs?head_sha=${{ github.sha }}&event=pull_request&status=success" --jq '.total_count' 2>/dev/null || echo 0)"
          if [ "${found:-0}" -gt 0 ] 2>/dev/null; then
            echo "a green pull-request run of checks exists on ${{ github.sha }} -- the tests are not run twice"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "no green pull-request run on ${{ github.sha }} -- running the tests on main"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  selftests:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      # Pinned to a COMMIT, not to `@v7`. A major tag moves onto new commits without our
      # involvement -- same name, different contents -- which is the shape the hub guards against
      # in its own tag ledger. Note the difference from numpy/scipy above: those stay unpinned
      # deliberately, because they are the SUBJECT of the check; these are the machinery that runs
      # it. To raise either, resolve the tag and commit the new SHA with the version beside it:
      #   gh api repos/actions/checkout/git/ref/tags/v7 --jq .object.sha
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1     # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # dsp_math and eq_gate import scipy by name, and since v3.0.12 the dsp_math selftest DESIGNS
      # crossovers, which needs it. This is the step whose absence turned a consumer's suite red on
      # that upgrade -- it is stated here rather than assumed. matplotlib too (skill #98): the installers now
      # upgrade all three on every run, so the plotting tool is tested on the version users get.
      #
      # The linter is PINNED while numpy and scipy on the same line are not, and the difference is deliberate.
      # A new numpy breaking us is information about the code. A new ruff going red is information
      # about ruff -- it ships new rules, and a check that turns red without anybody touching the
      # tree is exactly the blinking check this file opens by refusing to have. Raising the pin is
      # a commit with a diff attached.
      #
      # Which classes run, and why only those, is in pyproject.toml next to the choice itself.
      # Installed explicitly rather than through `uvx`: `uv` is not guaranteed on the runner
      # image, and a check that depends on a tool nobody promised is a check that goes red for a
      # reason unrelated to this repo. The runner below runs it (#133): it takes a ruff 0.12.0 on
      # PATH, and locally `uvx ruff@0.12.0 check`.
      - name: install dependencies
        run: python -m pip install --upgrade pip numpy scipy matplotlib ruff==0.12.0

      # GitHub sets CI=true, so a check the runner could not run (NOT RUN) fails here.
      - name: selftests, installer consistency and ruff
        run: scripts/run-selftests.sh

      # The installer is read by installer-consistency.py, never parsed by the shell that runs it; an
      # edit that breaks its syntax would reach a person's machine first. `-n` reads, runs nothing.
      - name: install.sh parses
        run: bash -n install.sh

  # Resonalyze's engines through the skill's wrapper (docs/DESIGN-2026-09-17-phase1-variants.md §3). The fork is
  # a submodule with `update = none` -- a recursive clone of the skill does not fetch it -- so this job asks for it
  # by name, and the SDK is exactly the one the wrapper's global.json names. The run is the SYNTHETIC set: the
  # Passat's goldens need the car's measurements, which are not public, so `resonalyze_engine.py acceptance`
  # runs where the data is. What this job proves is narrower and still worth a red: the pin builds, both
  # engines run through the wrapper, and the caller reads what comes back.
  engine:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1     # v7
      - name: the Resonalyze fork at the pin
        run: git submodule update --init --checkout vendor/Resonalyze
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: engines/resonalyze/global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: install dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: build the wrapper
        run: python skills/autosound-tuning/rew_tool/resonalyze_engine.py build
      - name: a synthetic set through both engines
        run: python skills/autosound-tuning/rew_tool/resonalyze_engine.py smoke

  # The installers' exit contract on a machine as a person has it (#142, PLAN-AUDIT §3 J6a item 5): a stock Ubuntu
  # 24.04's /usr/bin/python3 -- no setup-python here -- is externally managed (PEP 668), so pip refuses the method's
  # libraries there. A real `install.sh`, the method only, unattended: it must end 3, installed and NOT ready, with numpy
  # named in its receipt and in its verdict line -- not 0 and "Installed." over a python3 that cannot run the method.
  # Real downloads (the method's signed tag, Claude Code), hence the time limit; not the reviewer's (`--no-reviewer`): a
  # third party's download that fails says nothing about the exit contract. Claude Code's installer may be missing too
  # (`| sh` under dash; next wave's pool) -- the job holds the verdict to the receipt, whatever else it names.
  installers-ubuntu:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1     # v7
      # GitHub's image is not the stock one: its /etc/pip.conf sets `break-system-packages = true` (actions/runner-images,
      # images/ubuntu/scripts/build/install-python.sh), and pip honours that over PEP 668's marker -- `pip install --user`
      # took numpy there with the marker in place (CI 37845939761, 37853340329 ended "not ready" over Claude Code alone).
      # So pip runs here as on a stock Ubuntu 24.04: no config file (PIP_CONFIG_FILE=/dev/null) and
      # PIP_BREAK_SYSTEM_PACKAGES unset, in this check and in the install below. The marker is written where a stock one
      # has it only if it is missing (the folder `sysconfig.get_path("stdlib")` names, where pip looks); a numpy the image
      # already carries stops the job, naming the image; and pip itself must refuse a `--user` install before the run --
      # one it would take stops the job, printing what overrides PEP 668.
      - name: the runner's python3 as a stock Ubuntu 24.04 has it -- externally managed, no numpy
        run: |
          if /usr/bin/python3 -c "import numpy" 2>/dev/null; then
            echo "::error::numpy already imports in /usr/bin/python3 on this runner image (${ImageOS:-?} ${ImageVersion:-?}) -- the install cannot end NOT ready over it, which is what this job holds it to"
            exit 1
          fi
          stdlib="$(/usr/bin/python3 -c 'import sysconfig; print(sysconfig.get_path("stdlib"))')"
          if [ -f "$stdlib/EXTERNALLY-MANAGED" ]; then
            echo "PEP 668's marker is there: $stdlib/EXTERNALLY-MANAGED"
          else
            printf '%s\n' '[externally-managed]' \
              'Error=To install Python packages system-wide, try apt install python3-xyz, where xyz is the package you are trying to install.' \
              | sudo tee "$stdlib/EXTERNALLY-MANAGED" >/dev/null
            echo "PEP 668's marker was missing, and is written where a stock Ubuntu 24.04 has it: $stdlib/EXTERNALLY-MANAGED"
          fi
          rc=0
          said="$(env -u PIP_BREAK_SYSTEM_PACKAGES PIP_CONFIG_FILE=/dev/null /usr/bin/python3 -m pip install --user --dry-run numpy 2>&1)" || rc=$?
          if [ "$rc" = 0 ] || ! printf '%s\n' "$said" | grep 'externally-managed-environment' >/dev/null; then
            echo "::error::pip would take numpy for /usr/bin/python3 with no config file and PIP_BREAK_SYSTEM_PACKAGES unset (exit $rc) -- PEP 668 does not hold on this runner image (${ImageOS:-?} ${ImageVersion:-?}), so the install cannot end NOT ready. What pip said, the PIP_ variables, and pip's configuration:"
            printf '%s\n' "$said" | tail -n 8
            env | grep -i '^PIP_' || echo "(no PIP_ variable is set)"
            /usr/bin/python3 -m pip config debug || true
            exit 1
          fi
          echo "pip refuses a --user install into /usr/bin/python3 (externally-managed-environment): PEP 668 holds"
      - name: install.sh on the runner's own python3 ends 3, numpy named in the receipt and in the verdict
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/install.log"
          rc=0
          env -u PIP_BREAK_SYSTEM_PACKAGES PIP_CONFIG_FILE=/dev/null \
            bash install.sh --terminal --no-engine --no-reviewer --yes 2>&1 | tee "$log" || rc=$?
          receipt="${XDG_DATA_HOME:-$HOME/.local/share}/autosound/install-receipt.json"
          echo "install.sh ended with exit $rc; its receipt, $receipt:"
          cat "$receipt" || true
          if [ "$rc" = 0 ]; then
            echo "::error::install.sh ended READY (exit 0) on an externally managed /usr/bin/python3 -- pip took the libraries anyway, and this job expects 3: installed, NOT ready"
            exit 1
          fi
          if [ "$rc" != 3 ]; then
            echo "::error::install.sh ended with exit $rc, not 3 (installed, NOT ready)"
            exit 1
          fi
          /usr/bin/python3 - "$receipt" "$log" <<'PYEOF'
          import json, sys
          with open(sys.argv[1], encoding="utf-8-sig") as fh:
              receipt = json.load(fh)
          status, missing = receipt.get("status"), receipt.get("missing")
          if status != "not ready" or not isinstance(missing, list) or "numpy" not in missing:
              print(f"::error::the receipt says status {status!r}, missing {missing!r} -- want 'not ready' with numpy")
              sys.exit(1)
          # The verdict on screen and the receipt are one record: the line `Installed, NOT ready: <names>` names the
          # receipt's parts, in its order.
          verdict = "Installed, NOT ready: "
          with open(sys.argv[2], encoding="utf-8", errors="replace") as fh:
              said = [line.rstrip("\r\n")[len(verdict):] for line in fh if line.startswith(verdict)]
          if len(said) != 1 or said[0].split(", ") != missing:
              print(f"::error::the run's verdict names {said!r}, and its receipt {missing!r} -- want one line naming the same parts")
              sys.exit(1)
          print(f"exit 3, the receipt says {status!r} and the verdict names {missing}: the exit contract holds")
          PYEOF

  # The installer triplet on Windows (hub TCC-010). v3.0.50's beta-channel order check ran `bash`, and
  # on windows-latest that is WSL's launcher: six false divergences, seen first in TCC's Windows CI.
  # This job runs installer-consistency.py on the runner that consumer uses, so a Windows break is red
  # here before a tag rather than there after it. PYTHONUTF8 because a redirected stdout on Windows is
  # the locale's code page, and the checker prints non-ASCII when it fails.
  installers-windows:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1     # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: installer consistency (Windows)
        run: python scripts/installer-consistency.py
      # The same for install.ps1, with PowerShell's own parser: no network, nothing executed. The
      # author's Mac has no PowerShell, so without this an edit to install.ps1 is first parsed on a
      # user's Windows machine (the gh change of 2026-09-16 was the case that asked for it).
      - name: install.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1).Path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Host $_.ToString() }; exit 1 }
          Write-Host "install.ps1 parses: 0 errors"
      # The reviewer's key on Windows lives in a file only this user's login can open (DPAPI, the Arbiter's
      # decision of 2026-09-23, hub #197). The author's Mac cannot run it, so a real Windows does: a round trip,
      # the value absent from the file, and a key in the user environment (the registry) moved into the store.
      - name: reviewer key store (DPAPI) and the registry move
        shell: python
        env:
          AUTOSOUND_KEYSTORE: dpapi
        run: |
          import os, sys, tempfile, winreg
          home = tempfile.mkdtemp()
          os.environ.update(APPDATA=home, USERPROFILE=home, HOME=home)
          sys.path.insert(0, os.path.join("skills", "autosound-tuning", "scripts"))
          import autosound_ai as a
          v = "AQ." + "d" * 50
          a._dpapi_put("AUTOSOUND_TEST_API_KEY", v)
          assert a._dpapi_get("AUTOSOUND_TEST_API_KEY") == v
          assert v not in open(a._dpapi_path(), encoding="utf-8").read(), "the file holds the value in clear"
          assert a._dpapi_delete("AUTOSOUND_TEST_API_KEY")
          with winreg.OpenKey(winreg.HKEY_CURRENT_USER, "Environment", 0, winreg.KEY_ALL_ACCESS) as k:
              winreg.SetValueEx(k, "GEMINI_API_KEY", 0, winreg.REG_SZ, v)
          assert [h["file"] for h in a.shell_exports()] == [r"HKCU\Environment"], a.shell_exports()
          said = a.move_shell(ask=False)
          assert said[0].startswith("✓"), said
          a._KEYSTORE_CACHE.clear()
          assert a.keystore_get("GEMINI_API_KEY") == v and a.shell_exports() == [], said
          print("DPAPI round trip and the registry move: OK")
      # The atomic writers on the system they were made for (#135's Windows half, the final review's I-2): the retry of a
      # move a holder refuses, no folder fsync, the temp opened binary (`O_BINARY` -- in text mode every "\n" written
      # becomes "\r\n"), and two writers racing a reader that holds the file. The author's Mac fakes `os.name` for
      # these; here they are real. Its argv is scripts/selftests.txt's; stdlib only, so nothing to install.
      - name: atomic writes on Windows (project_io's selftest)
        run: python skills/autosound-tuning/rew_tool/project_io.py --selftest
      # The project lock on the system whose lock is not flock (#141): LockFileEx on the lock file's first byte, through
      # ctypes -- only ERROR_LOCK_VIOLATION read as held, a share's other refusal faked at the call and written with the
      # note -- and a second process told busy, then let in. The author's Mac runs only the POSIX half. stdlib only.
      - name: the project lock on Windows (write_lock's selftest)
        run: python skills/autosound-tuning/rew_tool/write_lock.py --selftest
      # The update path TCC calls, on the system whose line endings and git differ (#142, R33): the plugin's ready file
      # read byte for byte -- Windows' text mode wrote "\r\n", and the set-up note never went away -- and the
      # SessionStart hook run by Git for Windows' bash; the signature checks through Git for Windows' own ssh-keygen and
      # sh. The fake tools are shell scripts Windows cannot start: that part runs on POSIX only. Its argv is
      # scripts/run-selftests.sh's; stdlib only.
      - name: the update path on Windows (upkeep's selftest)
        run: python skills/autosound-tuning/scripts/upkeep.py selftest
