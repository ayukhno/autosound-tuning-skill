name: engine-binaries

# Resonalyze's engines as ONE self-contained executable per platform, so a person without the .NET SDK can run Phase 1's
# desk step (docs/DESIGN-2026-09-17-phase1-variants.md §6, 5c): `resonalyze_engine.py install-binary --from <zip>` puts
# one where the caller finds it. This workflow BUILDS them, as workflow artifacts named for the fork pin and the
# platform. Putting them on a release is not this repository's step: `gh release` belongs to the hub's release role
# (hub governance/RELEASE-CHANNEL.md), and a workflow here that uploaded would be a second road around it.
#
# When: on a tag push -- the version installers take -- and by hand. Not on every pull request: four builds of the same
# pin are the `engine` job's question in checks.yml asked four times.
on:
  push:
    tags: ["v3.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows and Linux cross-publish from Linux; macOS builds on macOS, where the SDK signs the apphost ad hoc --
          # an unsigned arm64 executable is killed on start.
          - { os: ubuntu-latest, rid: linux-x64, smoke: true }
          - { os: ubuntu-latest, rid: win-x64, smoke: false }
          - { os: macos-latest, rid: osx-arm64, smoke: true }
          - { os: macos-latest, rid: osx-x64, smoke: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1     # v7
      - name: the Resonalyze fork at the pin
        run: git submodule update --init --checkout vendor/Resonalyze
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: engines/resonalyze/global.json
      - name: publish ${{ matrix.rid }}
        run: >-
          dotnet publish engines/resonalyze/ResonalyzeEngine.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -o out/${{ matrix.rid }}
      - name: the pin in the artifact's name
        shell: bash
        run: echo "PIN=$(git -C vendor/Resonalyze rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
      # The binary that runs here goes through the same synthetic set as the checks job's wrapper: a binary that builds
      # and does not start is exactly what an install would otherwise find first.
      - if: matrix.smoke
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - if: matrix.smoke
        name: the published binary through the synthetic set
        shell: bash
        env:
          AUTOSOUND_RESONALYZE_ENGINE: ${{ github.workspace }}/out/${{ matrix.rid }}/ResonalyzeEngine
        run: |
          python -m pip install --upgrade pip numpy scipy
          python skills/autosound-tuning/rew_tool/resonalyze_engine.py smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resonalyze-engine-${{ env.PIN }}-${{ matrix.rid }}
          path: out/${{ matrix.rid }}
          if-no-files-found: error
